# Project-wide Gradle settings.

# JVM memory - increased to prevent "Java heap space" error during AAR transform
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable Gradle daemon & parallel builds for faster builds
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true

# AndroidX - React Native 0.76+ sudah fully AndroidX, TIDAK perlu Jetifier
# Jetifier=true menyebabkan error "Java heap space" saat transform react-android AAR
android.useAndroidX=true
android.enableJetifier=false

# Build hanya untuk arsitektur yang dibutuhkan (untuk dev: kurangi ke 1 arch agar lebih cepat)
# Production: armeabi-v7a,arm64-v8a,x86,x86_64
# Development (emulator x86_64): uncomment baris di bawah
# reactNativeArchitectures=x86_64
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# New Architecture (React Native 0.76 default)
newArchEnabled=true

# Hermes JS engine
hermesEnabled=true
